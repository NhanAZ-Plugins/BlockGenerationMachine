name: Build and validate ore generator

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Check source and dependency readiness
    runs-on: ubuntu-24.04
    steps:
      - name: Check out ore generator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned Axolotl-PM source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955 # 5.49.1
          path: .devtools-dependencies/axolotl-pm
          persist-credentials: false

      - name: Check out released BlockData virion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NhanAZ-Libraries/BlockData
          ref: 7df7273d462864e55a7cb59c5d1043378570f880 # v1.0.1
          path: virions/BlockData
          persist-credentials: false

      - name: Set up Axolotl-PM PHP environment
        uses: axolotl-pm/setup-php-action@b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
        with:
          php-version: "8.1"
          pm-version-major: "5"
          install-path: ./.php-bin

      - name: Lint plugin PHP source and fixtures
        shell: bash
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check generator metadata, ore weights, and default block
        shell: bash
        run: |
          php tests/parser-data.php
          php tests/first-join.php
          php tests/weighted-ore-selector.php
          php tests/default-block.php
          php tests/owner-placement.php

      - name: Check regeneration after generator removal
        run: php tests/generator-removal.php

      - name: Install pinned BlockData test dependencies
        run: composer install --working-dir=virions/BlockData --no-dev --no-interaction --prefer-dist --no-scripts

      - name: Verify legacy NBT migration reader
        run: php tests/legacy-storage.php virions/BlockData/vendor/autoload.php

      - name: Analyze and build with DevTools
        id: build
        uses: NhanAZ/DevTools@f89c929de25ea5e45418b8caeb688db77d97c2f6 # v1.0.10
        with:
          project: .
          virions: virions
          phpstan: max
          phpstan-server: .devtools-dependencies/axolotl-pm

      - name: Verify PHAR checksum and bundled licenses
        shell: bash
        env:
          PHAR_PATH: ${{ steps.build.outputs.phar }}
          PHAR_SHA256: ${{ steps.build.outputs.sha256 }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$PHAR_SHA256" "$PHAR_PATH" | sha256sum --check --status
          php -r '$phar = new Phar(getenv("PHAR_PATH")); foreach (["plugin.yml", "LICENSE", "META-INF/virions/BlockData/LICENSE"] as $entry) { if (!isset($phar[$entry])) { throw new RuntimeException("Missing PHAR entry: " . $entry); } }'
          cp "$BUILD_METADATA" build/build-metadata.json

      - name: Upload verified ore generator PHAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OreGenerator-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.phar }}
            build/build-metadata.json
          if-no-files-found: error
          retention-days: 14
